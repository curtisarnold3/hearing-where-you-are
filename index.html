<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearing Where You Are — watch, practice, or run it</title>
<style>
  :root{color-scheme:dark;--void:#090a10;--line:#2b3350;--ink:#f3ecdd;--dim:#9aa3bd;--dimmer:#636c89;--ember:#ff8a3d;--ember-hot:#ffd27a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
  .nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:calc(10px + env(safe-area-inset-top,0px)) clamp(12px,3vw,26px) 10px;
    background:#0a0b12f2;border-bottom:1px solid #161a28;backdrop-filter:blur(8px)}
  .brand{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;letter-spacing:.12em;font-size:14px;color:var(--ember)}
  .brand span{color:var(--dimmer);font-weight:500;letter-spacing:0;margin-left:8px;font-size:12.5px}
  .tabs{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .tab{all:unset;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--dim);
    border:1px solid var(--line);border-radius:8px;padding:8px 13px;transition:.2s;white-space:nowrap}
  .tab:hover{color:var(--ink);border-color:var(--ember)}
  .tab.on{color:#160b02;background:var(--ember);border-color:var(--ember);font-weight:600}
  .tab .n{opacity:.7;margin-right:6px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff8a3d00}50%{box-shadow:0 0 0 4px #ff8a3d55}}
  .tab.pulse{animation:pulse 1.1s ease-in-out 4}
  .host{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--void)}
  .hint{font-family:Inter;font-size:12px;color:var(--dimmer);width:100%;margin-top:2px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="nav">
    <span class="brand">ACOUSTIC GEOLOCATION<span>hearing where a recording was made</span></span>
    <div class="tabs">
      <button class="tab on" id="tWatch" type="button"><span class="n">1</span>Watch the intro</button>
      <button class="tab" id="tPlay" type="button"><span class="n">2</span>Walk through it</button>
      <button class="tab" id="tTool" type="button"><span class="n">3</span>Run the tool</button>
    </div>
    <div class="hint">Part 1 explains how it works. Part 2 lets you practice on a picture. Part 3 runs the real pipeline.</div>
  </div>
  <div class="host"><iframe id="frame" title="content"></iframe></div>
  <script>
  (function(){
    var frame=document.getElementById('frame');
    var tabs={
      watch:document.getElementById('tWatch'),
      play:document.getElementById('tPlay'),
      tool:document.getElementById('tTool')
    };
    var pages={watch:'intro.html', play:'walk.html', tool:'tool.html'};
    function show(which){
      if(!pages[which]) which='watch';
      frame.src=pages[which];
      Object.keys(tabs).forEach(function(key){
        tabs[key].classList.toggle('on', key===which);
      });
      if(which!=='watch') tabs[which].classList.remove('pulse');
      if(location.hash!=='#'+which) history.replaceState(null,'','#'+which);
      try{window.scrollTo(0,0);}catch(e){}
    }
    tabs.watch.onclick=function(){show('watch');};
    tabs.play.onclick=function(){show('play');};
    tabs.tool.onclick=function(){show('tool');};
    window.addEventListener('message',function(e){
      if(e.data==='introEnded'){tabs.play.classList.add('pulse'); tabs.tool.classList.add('pulse');}
      else if(e.data==='goIntro'){show('watch');}
      else if(e.data==='goPlay'){show('play');}
      else if(e.data==='goTool'){show('tool');}
    });
    window.addEventListener('hashchange',function(){
      var name=(location.hash||'#watch').slice(1);
      if(pages[name]) show(name);
    });
    var start=(location.hash||'#watch').slice(1);
    show(pages[start]?start:'watch');
  })();
  </script>
</body>
</html>
